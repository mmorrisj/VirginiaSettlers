name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite also pins Chapter 1's balance: a change that makes the
      # chapter unwinnable, or unlosable, fails here.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
